name: Standards source freshness
on:
  schedule:
    - cron: '17 13 * * *'
    - cron: '47 13 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [index, full]
        default: full
permissions:
  contents: read
  issues: write
concurrency:
  group: standards-freshness
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare official documents and locators
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '47 13 * * 1' && 'full') || 'index' }}
        run: |
          python3 scripts/source-scan.selftest.py
          python3 scripts/source-scan.py --mode "$MODE" --output "$RUNNER_TEMP/standards-scan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standards-observations
          path: ${{ runner.temp }}/standards-scan.json
          if-no-files-found: error
      - name: Reconcile source review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/source-issues.mjs "$RUNNER_TEMP/standards-scan.json"
