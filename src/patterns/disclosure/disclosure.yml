{"id":"pattern.disclosure","version":"1.0.0","title":"Disclosure","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"disclosure","url":"https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/","normative":false}],"requires":["semantics.accessible-name","semantics.disabled-readonly","semantics.expanded-state","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.native-elements","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.disclosure"}},"scope":"A single control that shows and hides one supplementary content region without creating a modal interaction","behavior":["Use a native button as the disclosure control unless an existing native element already supplies the required disclosure behavior; keep the control's accessible name understandable in both states","For a custom button, keep aria-expanded synchronized on every open and close path. The APG disclosure pattern makes aria-controls optional. When supplied, its ID reference must resolve to the controlled content.","Enter or Space toggles the disclosure exactly once while focus remains on the control","When collapsed, hide the controlled content from visual, pointer, keyboard, and accessibility-tree interaction; never leave focus inside content as it becomes hidden","Opening or closing a disclosure does not move focus, announce redundant state text, or change the state of unrelated disclosures unless an enclosing pattern explicitly defines that coordination"],"product_decisions":["controlled_region_relationship","initial_state","label_strategy","visibility_strategy"],"functional_spec_bindings":["structure","behavior","states","keyboard","focus"],"implementation_outcomes":["disclosure-control","disclosure-keyboard-model","disclosure-state-relationship","disclosure-visibility-lifecycle"],"evidence_routes":["unit","axe","e2e","human"]}
